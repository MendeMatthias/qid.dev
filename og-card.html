<!doctype html>
<!-- Source for the og:image. Regenerate: browse goto file://…/og-card.html && browse viewport 1200x630 && browse screenshot - -viewport site/og.png -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0a0e12; color: #e6edf3; position: relative;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .dots { position: absolute; inset: 0;
    background-image: radial-gradient(rgba(139,153,166,.33) 1.5px, transparent 1.5px);
    background-size: 30px 30px;
    -webkit-mask-image: radial-gradient(ellipse 85% 95% at 78% 8%, #000 25%, transparent 72%);
  }
  .glow { position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 65% at 80% 0%, rgba(94,234,160,.14), transparent 70%); }
  .inner { position: relative; height: 100%; padding: 72px 84px; display: flex; flex-direction: column; }
  .logo { display: flex; align-items: baseline; gap: 12px; font-size: 44px; font-weight: 700; }
  .logo .q { color: #5eeaa0; }
  .logo .dot { width: 11px; height: 11px; border-radius: 50%; background: #67e8f9; align-self: center; }
  h1 { margin-top: 84px; font-size: 84px; line-height: 1.04; letter-spacing: -0.025em; font-weight: 700; }
  h1 .thin { color: #8b99a6; font-weight: 400; }
  .sub { margin-top: 30px; font-size: 29px; color: #8b99a6; letter-spacing: -0.01em; }
  .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
  .badges { display: flex; gap: 14px; }
  .badge { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 20px; color: #5eeaa0;
    border: 2px solid rgba(94,234,160,.45); border-radius: 999px; padding: 9px 22px; }
  .url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 26px; color: #67e8f9; }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="glow"></div>
  <div class="inner">
    <div class="logo"><span><span class="q">q</span>ID</span><span class="dot"></span></div>
    <h1>Identity that outlives<br /><span class="thin">the quantum computer.</span></h1>
    <div class="sub">Post-quantum identity — keys, spends, login, recovery, encryption. From one seed.</div>
    <div class="foot">
      <div class="badges">
        <span class="badge">FIPS 203</span><span class="badge">FIPS 204</span><span class="badge">FIPS 205</span>
      </div>
      <div class="url">qid.dev</div>
    </div>
  </div>
</body>
</html>
