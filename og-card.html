<!doctype html>
<!-- Source for the og:image. Epic Higgsfield background (og-bg.png) + crisp branded overlay.
     Regenerate: browse goto file://…/og-card.html && browse viewport 1200x630 && browse screenshot --viewport site/og.png -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #05070a; position: relative;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .bg { position: absolute; inset: 0; width: 1200px; height: 630px; object-fit: cover; }
  /* legibility scrim: heavy on the left where the text lives, fading right to reveal the art */
  .scrim { position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(5,7,10,.92) 0%, rgba(5,7,10,.82) 34%, rgba(5,7,10,.28) 62%, rgba(5,7,10,0) 100%),
      linear-gradient(0deg, rgba(5,7,10,.6) 0%, rgba(5,7,10,0) 40%); }
  .inner { position: relative; height: 100%; padding: 70px 80px; display: flex; flex-direction: column; }
  .logo { display: flex; align-items: baseline; gap: 12px; font-size: 42px; font-weight: 700; color: #e6edf3; }
  .logo .q { color: #5eeaa0; }
  .logo .dot { width: 11px; height: 11px; border-radius: 50%; background: #67e8f9; align-self: center;
    box-shadow: 0 0 16px 2px rgba(103,232,249,.8); }
  h1 { margin-top: 76px; font-size: 82px; line-height: 1.03; letter-spacing: -0.025em; font-weight: 800; color: #f4f8fb;
    text-shadow: 0 2px 30px rgba(0,0,0,.7); max-width: 15ch; }
  h1 .thin { color: #9fb0bd; font-weight: 400; }
  .sub { margin-top: 26px; font-size: 27px; color: #b8c4cf; letter-spacing: -0.01em; max-width: 30ch;
    text-shadow: 0 1px 16px rgba(0,0,0,.8); }
  .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
  .badges { display: flex; gap: 13px; }
  .badge { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 19px; color: #5eeaa0;
    border: 1.5px solid rgba(94,234,160,.55); border-radius: 999px; padding: 8px 20px;
    background: rgba(5,20,14,.5); backdrop-filter: blur(4px); }
  .url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 25px; color: #67e8f9; font-weight: 600;
    text-shadow: 0 0 18px rgba(103,232,249,.5); }
</style>
</head>
<body>
  <img class="bg" src="og-bg.png" alt="" />
  <div class="scrim"></div>
  <div class="inner">
    <div class="logo"><span><span class="q">q</span>ID</span><span class="dot"></span></div>
    <h1>Identity that outlives<br /><span class="thin">the quantum computer.</span></h1>
    <div class="sub">Keys, spends, login, recovery, encryption &mdash; from one seed.</div>
    <div class="foot">
      <div class="badges"><span class="badge">FIPS 203</span><span class="badge">FIPS 204</span><span class="badge">FIPS 205</span></div>
      <div class="url">qid.dev</div>
    </div>
  </div>
</body>
</html>
